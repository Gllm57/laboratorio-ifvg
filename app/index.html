<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio IFVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
/* Layout: minimal — una columna de 1040px, mucho aire, superficies blancas sin bordes, un solo acento cálido. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --soft: #f0f2f5; --chart-bg: #ffffff;
  --ink: #18202b; --ink-2: #677382; --line: #e7eaef; --grid: #f1f3f6;
  --accent: #c97a00; --accent-soft: #fdf3e2; --on-accent: #ffffff;
  --info: #3b6fd9; --on-info: #ffffff; --mute-c: #e3e7ec; --on-mute-c: #18202b;
  --bull: #10a07b; --bull-body: #e2f5ee; --bear: #e2544b;
  --good-bg: #ebf7f2; --bad-bg: #fdeeed; --mid-bg: #fdf5e6;
  --shadow: 0 1px 2px rgba(20, 30, 45, 0.04), 0 4px 16px rgba(20, 30, 45, 0.05);
  --r: 14px;
  --f-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1318; --surface: #171c23; --soft: #1e242c; --chart-bg: #171c23;
  --ink: #e8edf2; --ink-2: #95a1ae; --line: #262d36; --grid: #1f252d;
  --accent: #f0ad3c; --accent-soft: #2b2416; --on-accent: #1a1300;
  --info: #79a5ff; --on-info: #0c1420; --mute-c: #2a313a; --on-mute-c: #e8edf2;
  --bull: #34c79f; --bull-body: #163a31; --bear: #f2716a;
  --good-bg: #15302a; --bad-bg: #3a1d1b; --mid-bg: #33291a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #171c23; --soft: #1e242c; --chart-bg: #171c23;
  --ink: #e8edf2; --ink-2: #95a1ae; --line: #262d36; --grid: #1f252d;
  --accent: #f0ad3c; --accent-soft: #2b2416; --on-accent: #1a1300;
  --info: #79a5ff; --on-info: #0c1420; --mute-c: #2a313a; --on-mute-c: #e8edf2;
  --bull: #34c79f; --bull-body: #163a31; --bear: #f2716a;
  --good-bg: #15302a; --bad-bg: #3a1d1b; --mid-bg: #33291a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--info); text-underline-offset: 3px; }
h1, h2, h3 { line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
h1 { font-size: clamp(28px, 4.2vw, 40px); font-weight: 800; }
h2 { font-size: 19px; }
h3 { font-size: 17px; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 13px; }
.muted { color: var(--ink-2); }
.pos { color: var(--bull); } .neg { color: var(--bear); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--accent); }
.lead { font-size: 17px; color: var(--ink-2); max-width: 60ch; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.top-in { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: contents; }
.brand a.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
.logo b { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.logo svg { flex: none; }
.brand .sp { display: none; }
.chip { font: 600 12.5px/1 var(--f-body); padding: 7px 11px; border-radius: 999px; background: var(--surface); color: var(--ink-2); white-space: nowrap; box-shadow: var(--shadow); }
.chip.acc { color: var(--accent); }
.nav { order: 3; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; justify-content: center; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 8px 14px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px; border-radius: 999px; white-space: nowrap; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.chips { order: 4; display: flex; gap: 8px; }
@media (max-width: 860px) { .nav { order: 5; flex-basis: 100%; justify-content: flex-start; margin-inline: -4px; } .chips { margin-left: auto; } }

main { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 80px; display: grid; gap: 28px; }
main > * { min-width: 0; }
.page-head { display: grid; gap: 10px; padding-top: 12px; }
.page-head.slim h1 { font-size: clamp(26px, 3.6vw, 34px); }
.panel { background: var(--surface); border-radius: var(--r); padding: 24px; display: grid; gap: 16px; min-width: 0; box-shadow: var(--shadow); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.center { text-align: center; justify-items: center; }

.btn { font: 600 14.5px/1 var(--f-body); padding: 12px 18px; min-height: 44px; border-radius: 999px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--shadow); transition: transform .12s ease, background .12s ease; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.pri { background: var(--ink); color: var(--bg); }
.btn.buy { background: var(--bull); color: #fff; }
.btn.sell { background: var(--bear); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 36px; align-items: center; padding-top: 16px; }
.hero-txt { display: grid; gap: 18px; }
.hero h1 { font-size: clamp(32px, 4.6vw, 48px); }
.hero-chart { min-width: 0; }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 6px; align-content: start; box-shadow: var(--shadow); }
.tile > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tile b { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile b small { font-size: 15px; color: var(--ink-2); font-weight: 600; }
.tile .sub { color: var(--ink-2); font-size: 12.5px; }
.bar { display: block; height: 5px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.level-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.ladder { display: flex; gap: 6px; }
.ladder span { width: 30px; height: 30px; display: grid; place-items: center; font: 700 13px var(--f-body); border-radius: 999px; background: var(--soft); color: var(--ink-2); }
.ladder span.on { background: var(--accent); color: var(--on-accent); }
.reqs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reqs li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--soft); font-size: 14.5px; }
.reqs li b { font: 500 13px var(--f-mono); white-space: nowrap; color: var(--ink-2); }
.reqs li.ok { background: var(--good-bg); }
.reqs li.ok span::before { content: "✓  "; color: var(--bull); font-weight: 700; }
.routine { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; counter-reset: r; }
.routine li { counter-increment: r; display: grid; gap: 6px; align-content: start; }
.routine li::before { content: counter(r); width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; }
.routine span { color: var(--ink-2); font-size: 14px; }
@media (max-width: 760px) { .routine { grid-template-columns: 1fr 1fr; } }
.disclaimer { font-size: 12.5px; color: var(--ink-2); max-width: 78ch; }

/* Ruta */
.phase { display: grid; gap: 14px; }
.phase-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.phase-head > div { display: grid; gap: 4px; }
.pill { font: 600 12px/1 var(--f-body); padding: 6px 10px; border-radius: 999px; background: var(--soft); color: var(--ink-2); white-space: nowrap; justify-self: start; }
.pill.ok { background: var(--good-bg); color: var(--bull); }
.pill.mid { background: var(--mid-bg); color: var(--accent); }
.pill.no { background: var(--bad-bg); color: var(--bear); }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.day { display: grid; gap: 2px; padding: 14px 16px; background: var(--surface); border-radius: 12px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); transition: transform .12s ease; }
.day:hover { transform: translateY(-2px); }
.day .dn { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.day .dt { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
.day.done { background: var(--good-bg); box-shadow: none; }
.day.done .dn { color: var(--bull); }
.day.done .dn::after { content: " · hecho"; }

.lesson { display: grid; gap: 28px; max-width: 820px; width: 100%; justify-self: center; }
.crumbs { font-size: 13.5px; color: var(--ink-2); }
.crumbs a { color: var(--ink-2); }
.keys { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.keys li::marker { color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 10px; }

/* Diagramas */
.dg { display: grid; gap: 10px; min-width: 0; }
.dg-chart { overflow-x: auto; border-radius: 12px; background: var(--chart-bg); min-width: 0; box-shadow: var(--shadow); }
.dg-chart svg { display: block; }
.dg-cap { font-size: 14px; color: var(--ink-2); max-width: 72ch; }
.dg-tag { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.dg-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.dg-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .dg-grid3, .dg-grid2 { grid-template-columns: 1fr; } }
.dg-card { background: var(--surface); border-radius: var(--r); padding: 22px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.dg-tools { display: flex; justify-content: flex-end; }
svg .axis { font: 10.5px var(--f-mono); fill: var(--ink-2); }
svg .lbl { font: 600 11px var(--f-body); paint-order: stroke; stroke: var(--chart-bg); stroke-width: 3px; stroke-linejoin: round; }
svg .lbl.num { font: 600 12px var(--f-mono); }
.anat { width: 100%; max-width: 420px; justify-self: center; }
.anat .lbl { stroke: var(--surface); }
.timeline { width: 100%; min-width: 560px; display: block; }
.timeline .lbl { stroke: none; }
.scroll-x { overflow-x: auto; min-width: 0; }
.road { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.road li { display: grid; gap: 3px; padding: 14px; background: var(--soft); border-radius: 10px; }
.road li span { font-size: 12.5px; color: var(--accent); font-weight: 600; }
.road li small { color: var(--ink-2); font-size: 13px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.note { color: var(--ink-2); max-width: 260px; }
.formula { font: 500 15px/1.9 var(--f-mono); }
.formula span { background: var(--soft); padding: 3px 8px; border-radius: 6px; }
ul.checks, ul.steps, ul.ok, ul.x { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.checks li::before { content: "○  "; color: var(--accent); font-weight: 700; }
ul.steps { counter-reset: st; } ul.steps li { counter-increment: st; } ul.steps li::before { content: counter(st) ".  "; color: var(--accent); font-weight: 700; }
ul.ok li::before { content: "✓  "; color: var(--bull); font-weight: 700; }
ul.x li::before { content: "✕  "; color: var(--bear); font-weight: 700; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.vs > div { display: grid; gap: 8px; align-content: start; }
@media (max-width: 520px) { .vs { grid-template-columns: 1fr; } }
.plan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.plan > div { display: grid; gap: 2px; padding: 14px; background: var(--soft); border-radius: 10px; }
.plan b { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.plan span { font-size: 13px; color: var(--ink-2); }
@media (max-width: 620px) { .plan { grid-template-columns: 1fr 1fr; } }
.steps3, .three { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.steps3 li { display: grid; gap: 4px; padding: 14px; background: var(--soft); border-radius: 10px; }
.steps3 li span { font-size: 13px; color: var(--ink-2); }
@media (max-width: 680px) { .steps3, .three { grid-template-columns: 1fr; } }
.split { display: flex; height: 44px; border-radius: 10px; overflow: hidden; font: 600 13px var(--f-body); }
.split > div { display: grid; place-items: center; }
.split .s1 { background: var(--mute-c); color: var(--on-mute-c); } .split .s2 { background: var(--accent); color: var(--on-accent); } .split .s3 { background: var(--info); color: var(--on-info); }

/* Estrategia */
.step { background: var(--surface); border-radius: var(--r); padding: 22px; display: grid; gap: 8px; align-content: start; box-shadow: var(--shadow); }
.step p { color: var(--ink-2); font-size: 14.5px; }
.k { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 15px; flex: none; }
.model-head { display: flex; gap: 12px; align-items: center; }

/* Cuestionarios */
.qform { display: grid; gap: 14px; }
.qform fieldset { border: 0; border-radius: 12px; padding: 14px 16px 16px; margin: 0; display: grid; gap: 4px; min-width: 0; background: var(--soft); }
.qform legend { font-weight: 600; padding: 0; float: left; width: 100%; margin-bottom: 6px; }
.qform fieldset.good { background: var(--good-bg); }
.qform fieldset.bad { background: var(--bad-bg); }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.opt:hover { background: var(--surface); }
.opt input { margin-top: 6px; accent-color: var(--accent); }
.exp { font-size: 14px; color: var(--ink-2); padding-inline: 10px; }
.ok-msg { color: var(--bull); font-weight: 600; } .bad-msg { color: var(--bear); font-weight: 600; }
.warn { color: var(--accent); font-weight: 600; font-size: 14px; }

/* Práctica */
.excards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.excard { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 0; border-radius: var(--r); padding: 20px; display: grid; gap: 6px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s ease; }
.excard:hover { transform: translateY(-2px); }
.excard b { font-size: 16.5px; font-weight: 700; }
.excard span { color: var(--ink-2); font-size: 14px; }
.excard .exstat { font-size: 12.5px; font-weight: 600; }
.exrun { display: grid; gap: 16px; }
.exbar { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.prompt { font-size: 21px; }
.fb { display: grid; gap: 12px; justify-items: start; }
.fb-box { padding: 14px 16px; border-radius: 12px; display: grid; gap: 4px; width: 100%; }
.fb-box.good { background: var(--good-bg); }
.fb-box.bad { background: var(--bad-bg); }
.big { font-size: 72px; letter-spacing: -0.04em; }
input[type=number], select, textarea { font: 15px var(--f-body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100%; }
#calc-n { width: 150px; }

/* Selector de temporalidad */
.tfbar { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--soft); }
.tfbar button { font: 600 12.5px/1 var(--f-body); padding: 7px 11px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); cursor: pointer; }
.tfbar button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Simulador */
.sim { display: grid; gap: 14px; }
.sim-top { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr) minmax(0, 260px); gap: 14px; align-items: stretch; }
.htf, .live { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.htf-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.htf-head .dg-tag { margin: 0; }
.htf-head .tfbar button { padding: 5px 9px; }
.sim-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start; }
.sim-stats > div { background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; box-shadow: var(--shadow); }
.sim-stats span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.sim-stats b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.live h2 { font-size: 15px; display: flex; justify-content: space-between; margin-bottom: 8px; }
.live h2 span { color: var(--accent); font-size: 13px; }
.live ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.live li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 13.5px; line-height: 1.35; }
.live li i { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; background: var(--soft); color: var(--ink-2); }
.live li.ok i { background: var(--bull); color: #fff; }
.live li.wait i { background: var(--accent-soft); color: var(--accent); }
.live li small { display: block; color: var(--ink-2); font-size: 12px; }
@media (max-width: 900px) { .sim-top { grid-template-columns: 1fr 1fr; } .sim-stats { grid-column: 1 / -1; grid-row: 1; grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 560px) { .sim-top { grid-template-columns: 1fr; } .sim-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sim-tfrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.sim-tfrow .dg-tag { margin: 0; }
.sim-ctrl .sp { flex: 1; }
.order { box-shadow: 0 0 0 2px var(--line), var(--shadow); }
.order.is-buy { box-shadow: 0 0 0 2px var(--bull), var(--shadow); } .order.is-sell { box-shadow: 0 0 0 2px var(--bear), var(--shadow); }
.order-head { display: grid; gap: 2px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.form-grid label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form-grid label.chk { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.order-sum { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
details.panel summary { cursor: pointer; font-weight: 600; }
.result .res-head { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
