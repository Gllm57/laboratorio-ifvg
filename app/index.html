<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="description" content="Aprende la estrategia del Esses Bootcamp: 50 lecciones, práctica evaluada y simulador.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lab IFVG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Laboratorio IFVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
/* Layout: app móvil oscura y suave — una columna de 760px, tarjetas muy redondeadas, botones píldora y un degradado lima-lavanda para lo importante. Un solo tema oscuro, elegido a propósito. */
:root {
  --bg: #111214; --surface: #1b1c1f; --soft: #24252a; --chart-bg: #1b1c1f;
  --ink: #f2f2f0; --ink-2: #a5a6aa; --line: #2b2c31; --grid: #232428;
  --accent: #e9e9a9; --on-accent: #16171a; --info: #d5d6ef; --on-info: #16171a;
  --mute-c: #2b2c31; --on-mute-c: #f2f2f0;
  --bull: #c9ddc4; --bear: #f1a9c9; --bull-body: #c9ddc4;
  --c-up: #d9dca4; --c-up-body: #d9dca4; --c-down: #c9caef; --c-down-body: transparent;
  --good-bg: #1f2a22; --bad-bg: #2e2027; --mid-bg: #2b2a1d;
  --grad: linear-gradient(135deg, #c7cfb2 0%, #e8e8a8 30%, #d6d7ee 62%, #c5cdb8 100%);
  --r: 24px; --ease: cubic-bezier(.2, .7, .2, 1);
  --f-body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--info); text-underline-offset: 3px; }
h1, h2, h3 { line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.02em; font-weight: 500; }
h1 { font-size: clamp(28px, 6vw, 36px); }
h2 { font-size: 18px; }
h3 { font-size: 16px; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 13px; }
.muted { color: var(--ink-2); }
.pos { color: var(--bull); } .neg { color: var(--bear); } .acc-t { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--accent); }
.lead { font-size: 16px; color: var(--ink-2); max-width: 58ch; }

/* Animaciones: el estado final es el visible; la animación solo parte desde oculto */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes cdl { from { opacity: 0; transform: scaleY(.15); } }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes shimmer { 0% { background-position: 0% 30%; } 100% { background-position: 100% 70%; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 50% { transform: translateY(-6px) rotate(var(--rot, 0deg)); } }
@keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233, 233, 169, .45); } 100% { box-shadow: 0 0 0 10px rgba(233, 233, 169, 0); } }
main > * { animation: rise .55s var(--ease) backwards; }
main > *:nth-child(2) { animation-delay: 60ms; } main > *:nth-child(3) { animation-delay: 120ms; } main > *:nth-child(4) { animation-delay: 180ms; }
main > *:nth-child(5) { animation-delay: 240ms; } main > *:nth-child(6) { animation-delay: 300ms; } main > *:nth-child(n+7) { animation-delay: 360ms; }
svg .cdl { animation: cdl .45s var(--ease) backwards; transform-box: fill-box; transform-origin: 50% 100%; }
svg .ln { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.3s ease-out backwards; }

/* Barra superior y navegación */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top-in { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: contents; }
.brand a.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
.logo b { font-weight: 600; font-size: 16px; }
.brand .sp { display: none; }
.chips { order: 4; display: flex; gap: 6px; }
.chip { font: 500 12.5px/1 var(--f-body); padding: 9px 12px; border-radius: 999px; background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.chip.acc { color: var(--accent); }
.nav { order: 3; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); margin-left: auto; }
.nav a { padding: 8px 13px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; border-radius: 999px; white-space: nowrap; transition: background .2s, color .2s; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--bg); background: var(--ink); }
.nav a svg { display: none; }
@media (max-width: 760px) {
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); } /* el blur crearía un contenedor para la barra fija */
  .chips { margin-left: auto; }
  .nav { position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0; justify-content: space-between; padding: 6px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
  .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; font-size: 10.5px; min-height: 48px; justify-content: center; }
  .nav a svg { display: block; }
  .nav a[aria-current="page"] svg path { stroke: var(--bg); }
  main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)) !important; }
}
body.onb .top, body.onb .nav { display: none; }

main { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 72px; display: grid; gap: 14px; }
main > * { min-width: 0; }
.page-head { display: grid; gap: 8px; padding: 16px 4px 6px; }
.page-head.slim h1 { font-size: clamp(26px, 5vw, 32px); }
.panel, .card { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-head.line { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.center { text-align: center; justify-items: center; }

.btn { font: 600 15px/1 var(--f-body); padding: 0 20px; min-height: 48px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .15s var(--ease), opacity .2s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.buy { background: var(--grad); color: var(--on-accent); border: 0; }
.btn.sell { background: transparent; color: var(--ink); border-color: #3a3b40; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.wide { width: 100%; min-height: 54px; font-size: 16px; }
.link { font: 500 15px var(--f-body); color: var(--ink-2); background: none; border: 0; cursor: pointer; min-height: 44px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Bienvenida */
.welcome { min-height: calc(100svh - 40px); display: flex; flex-direction: column; gap: 22px; padding-top: 12px; position: relative; max-width: 480px; width: 100%; justify-self: center; }
.welcome::before, .welcome::after { content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%; z-index: -1; pointer-events: none; }
.welcome::before { left: -110px; top: 90px; background: radial-gradient(circle, rgba(222, 226, 160, .2), transparent 70%); }
.welcome::after { right: -130px; top: 240px; background: radial-gradient(circle, rgba(196, 198, 240, .17), transparent 70%); }
.w-top { display: flex; justify-content: flex-end; }
.w-vis { position: relative; min-height: 330px; display: grid; place-items: center; animation: rise .6s var(--ease) backwards; }
.w-txt { margin-top: auto; display: grid; gap: 16px; animation: rise .6s .1s var(--ease) backwards; }
.w-txt h1 { font-size: 32px; }
.dots { display: flex; gap: 6px; }
.dots span { width: 6px; height: 6px; border-radius: 3px; background: #4a4b50; transition: width .3s var(--ease); }
.dots span.on { width: 20px; background: var(--ink); }
.float-card { width: min(320px, 100%); padding: 16px; border-radius: 26px; background: rgba(36, 37, 42, .94); border: 1px solid rgba(255, 255, 255, .06); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); display: grid; gap: 10px; animation: bob 6s ease-in-out infinite; }
.float-card #w-chart { border-radius: 14px; overflow: hidden; }
.fc-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); }
.tag { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); }
.fc-msg { font-size: 13px; color: #c9cace; padding: 10px 14px; border-radius: 999px; background: #2b2c31; }
.float-tag { position: absolute; right: 4%; bottom: 8px; --rot: 3deg; padding: 10px 14px; border-radius: 16px; background: var(--grad); color: var(--on-accent); font-size: 13px; font-weight: 600; box-shadow: 0 14px 30px rgba(0, 0, 0, .4); animation: bob 5s .6s ease-in-out infinite; }
.w-steps { display: grid; gap: 10px; width: min(340px, 100%); }
.w-steps > div { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; padding: 14px 16px; border-radius: 22px; background: var(--surface); animation: rise .5s var(--ease) backwards; }
.w-steps > div:nth-child(2) { animation-delay: .1s; margin-left: 18px; } .w-steps > div:nth-child(3) { animation-delay: .2s; margin-left: 36px; background: var(--grad); color: var(--on-accent); }
.w-steps i { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 600; background: var(--soft); color: var(--ink); }
.w-steps > div:nth-child(3) i { background: rgba(22, 23, 26, .12); color: var(--on-accent); }
.w-steps span { font-size: 13px; opacity: .75; }
.w-score { display: grid; justify-items: center; gap: 16px; }
.ring { width: 150px; height: 150px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: radial-gradient(closest-side, var(--bg) 82%, transparent 83%), conic-gradient(#e8e8a8 0 92%, var(--soft) 0); animation: pop .7s var(--ease) backwards; }
.ring b { font-size: 48px; font-weight: 600; line-height: 1; } .ring span { font-size: 12px; color: var(--ink-2); }
.w-score ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.w-score li { padding: 7px 12px; border-radius: 999px; background: var(--good-bg); color: var(--bull); font-size: 13px; }
.w-score li.warn-i { background: var(--mid-bg); color: var(--accent); }

/* Inicio */
.g-hero { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 22px max(16px, env(safe-area-inset-left, 0px)) 18px; border-radius: 0 0 34px 34px; background: var(--grad); background-size: 220% 220%; animation: rise .55s var(--ease) backwards, shimmer 14s ease-in-out infinite alternate; color: var(--on-accent); display: grid; gap: 18px; }
@media (min-width: 761px) { .g-hero { margin: 0; border-radius: 34px; padding: 26px; } }
.g-hero h1 { font-size: clamp(30px, 6vw, 38px); font-weight: 400; }
.g-hero h1 b { font-weight: 700; }
.g-row { display: flex; }
.pill-dark { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; background: #1b1c1f; color: #f2f2f0; font-size: 13px; font-weight: 500; }
.pill-dark i { width: 7px; height: 7px; border-radius: 50%; background: #6e7075; }
.pill-dark.live i { background: #c9ddc4; animation: pulse 1.6s infinite; }
.lvl-card { border-radius: 24px; background: #1b1c1f; color: #f2f2f0; padding: 18px 20px; display: grid; gap: 12px; }
.lvl-card > small { color: var(--ink-2); font-size: 12.5px; }
.lvl-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.lvl-top > span:first-child { display: grid; }
.lvl-top small { font-size: 13px; color: var(--ink-2); }
.lvl-top b { font-size: 22px; font-weight: 600; }
.xp { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.xp small { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.gbar { display: block; height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.gbar.big { height: 18px; background: var(--bg); }
.gbar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #e9e9a9, #d5d6ef); transform-origin: left; animation: grow 1s .25s var(--ease) backwards; }
.card.rows { padding: 6px 20px; gap: 0; }
.rows > div { display: flex; justify-content: space-between; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.rows > div:last-child { border-bottom: 0; }
.rows span { color: #c9cace; } .rows b { font-weight: 600; }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.act { min-height: 128px; border-radius: 22px; background: var(--surface); padding: 14px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; transition: transform .2s var(--ease), background .2s; }
.act:hover { transform: translateY(-3px); background: #212226; }
.act i { align-self: flex-end; width: 28px; height: 28px; border-radius: 50%; border: 1.6px solid currentColor; display: grid; place-items: center; font-style: normal; font-weight: 600; }
.act span { display: grid; }
.act small { font-size: 12px; color: var(--ink-2); }
.act b { font-size: 18px; font-weight: 500; }
.act em { font-style: normal; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act.acc i, .act.acc small { color: var(--accent); } .act.lav i { color: var(--info); }
.pbars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pbars > div { height: 120px; border-radius: 16px; background: var(--soft); position: relative; display: flex; justify-content: center; overflow: hidden; }
.pbars span { position: absolute; top: 9px; font-size: 12px; color: #c9cace; }
.pbars i { position: absolute; left: 6px; right: 6px; bottom: 6px; height: calc(var(--h) * .68); border-radius: 11px; transform-origin: bottom; animation: growY .8s var(--ease) backwards; }
.pbars i.g, .legend i.g { background: #c9ddc4; } .pbars i.y, .legend i.y { background: #eeeda0; } .pbars i.p, .legend i.p { background: #f1c6de; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: flex; align-items: center; gap: 6px; } .legend i { width: 9px; height: 9px; border-radius: 3px; }
.reqs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reqs li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--soft); font-size: 14.5px; }
.reqs li b { font: 500 13px var(--f-mono); white-space: nowrap; color: var(--ink-2); }
.reqs li.ok { background: var(--good-bg); }
.reqs li.ok span::before { content: "✓  "; color: var(--bull); font-weight: 700; }
.disclaimer { font-size: 12.5px; color: #7d7f84; max-width: 78ch; padding: 4px; }

/* Ruta */
.g-card { position: relative; display: grid; gap: 2px; padding: 22px; min-height: 110px; align-content: end; border-radius: var(--r); background: var(--grad); background-size: 200% 200%; animation: rise .55s var(--ease) backwards, shimmer 14s ease-in-out infinite alternate; color: var(--on-accent); text-decoration: none; transition: transform .2s var(--ease); }
.g-card:hover { transform: translateY(-2px); }
.g-card small { font-size: 13px; color: #3b3d35; } .g-card b { font-size: 21px; font-weight: 600; }
.g-card i { position: absolute; right: 18px; top: 18px; width: 30px; height: 30px; border-radius: 50%; border: 1.6px solid var(--on-accent); display: grid; place-items: center; font-style: normal; font-size: 18px; }
.phase { gap: 12px; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 15px; }
.stats3 span { display: grid; } .stats3 small { font-size: 12px; color: var(--ink-2); } .stats3 b { font-weight: 500; }
.pill { font: 500 12px/1 var(--f-body); padding: 7px 11px; border-radius: 999px; background: var(--soft); color: var(--ink-2); white-space: nowrap; justify-self: start; }
.pill.ok { background: var(--good-bg); color: var(--bull); }
.pill.mid { background: var(--mid-bg); color: var(--accent); }
.pill.no { background: var(--bad-bg); color: var(--bear); }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.day { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 10px 12px; background: var(--soft); border-radius: 16px; text-decoration: none; color: var(--ink); transition: transform .15s var(--ease), background .2s; }
.day:hover { transform: translateY(-2px); background: #2b2c31; }
.day .dn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; background: var(--bg); color: var(--ink-2); }
.day .dt { font-weight: 500; font-size: 13.5px; line-height: 1.3; }
.day.done .dn { background: #c9ddc4; color: #16171a; }
.day.now .dn { background: var(--accent); color: var(--on-accent); animation: pulse 1.8s infinite; }

.lesson { display: grid; gap: 16px; }
.crumbs { font-size: 13.5px; color: var(--ink-2); }
.crumbs a { color: var(--ink-2); }
.keys { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.keys li::marker { color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 10px; }

/* Diagramas */
.dg { display: grid; gap: 10px; min-width: 0; }
.dg-chart { overflow-x: auto; border-radius: 20px; background: var(--chart-bg); min-width: 0; }
.dg-chart svg { display: block; }
.dg-cap { font-size: 14px; color: var(--ink-2); max-width: 70ch; }
.dg-tag { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.dg-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.dg-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .dg-grid3, .dg-grid2 { grid-template-columns: 1fr; } }
.dg-card { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; min-width: 0; }
.dg-tools { display: flex; justify-content: flex-end; }
svg .axis { font: 10.5px var(--f-mono); fill: var(--ink-2); }
svg .lbl { font: 600 11px var(--f-body); paint-order: stroke; stroke: var(--chart-bg); stroke-width: 3px; stroke-linejoin: round; }
svg .lbl.num { font: 600 12px var(--f-mono); }
.anat { width: 100%; max-width: 420px; justify-self: center; }
.anat .lbl { stroke: var(--surface); }
.timeline { width: 100%; min-width: 560px; display: block; }
.timeline .lbl { stroke: none; }
.scroll-x { overflow-x: auto; min-width: 0; }
.road { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.road li { display: grid; gap: 3px; padding: 14px; background: var(--soft); border-radius: 16px; }
.road li span { font-size: 12.5px; color: var(--accent); }
.road li small { color: var(--ink-2); font-size: 13px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.note { color: var(--ink-2); max-width: 260px; }
.formula { font: 500 15px/1.9 var(--f-mono); }
.formula span { background: var(--soft); padding: 3px 8px; border-radius: 8px; }
ul.checks, ul.steps, ul.ok, ul.x { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.checks li::before { content: "○  "; color: var(--accent); font-weight: 700; }
ul.steps { counter-reset: st; } ul.steps li { counter-increment: st; } ul.steps li::before { content: counter(st) ".  "; color: var(--accent); font-weight: 700; }
ul.ok li::before { content: "✓  "; color: var(--bull); font-weight: 700; }
ul.x li::before { content: "✕  "; color: var(--bear); font-weight: 700; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.vs > div { display: grid; gap: 8px; align-content: start; }
@media (max-width: 520px) { .vs { grid-template-columns: 1fr; } }
.plan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.plan > div { display: grid; gap: 2px; padding: 14px; background: var(--soft); border-radius: 16px; }
.plan > div:first-child { background: var(--grad); color: var(--on-accent); }
.plan > div:first-child span { color: #3b3d35; }
.plan b { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.plan span { font-size: 13px; color: var(--ink-2); }
@media (max-width: 620px) { .plan { grid-template-columns: 1fr 1fr; } }
.steps3, .three { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.steps3 li { display: grid; gap: 4px; padding: 14px; background: var(--soft); border-radius: 16px; }
.steps3 li span { font-size: 13px; color: var(--ink-2); }
@media (max-width: 680px) { .steps3, .three { grid-template-columns: 1fr; } }
.split { display: flex; height: 46px; border-radius: 999px; overflow: hidden; font: 600 13px var(--f-body); }
.split > div { display: grid; place-items: center; }
.split .s1 { background: var(--mute-c); color: var(--on-mute-c); } .split .s2 { background: var(--accent); color: var(--on-accent); } .split .s3 { background: var(--info); color: var(--on-info); }

/* Estrategia */
.step { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 8px; align-content: start; }
.step:nth-child(3) { background: var(--grad); color: var(--on-accent); }
.step:nth-child(3) p { color: #3b3d35; }
.step p { color: var(--ink-2); font-size: 14.5px; }
.k { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--soft); color: var(--ink); font-weight: 600; font-size: 15px; flex: none; }
.step:nth-child(3) .k { background: rgba(22, 23, 26, .12); color: var(--on-accent); }
.model-head { display: flex; gap: 12px; align-items: center; }

/* Cuestionarios */
.qform { display: grid; gap: 12px; }
.qform fieldset { border: 0; border-radius: 20px; padding: 16px; margin: 0; display: grid; gap: 6px; min-width: 0; background: var(--soft); }
.qform legend { font-weight: 500; padding: 0; float: left; width: 100%; margin-bottom: 6px; font-size: 15.5px; }
.qform fieldset.good { background: var(--good-bg); animation: pop .45s var(--ease); }
.qform fieldset.bad { background: var(--bad-bg); animation: shake .4s ease; }
.opt { display: flex; gap: 10px; align-items: center; padding: 10px 14px; min-height: 46px; border-radius: 999px; cursor: pointer; background: var(--bg); transition: background .2s; }
.opt:hover { background: #18191c; }
.opt:has(input:checked) { background: var(--grad); color: var(--on-accent); }
.opt input { accent-color: #16171a; }
.exp { font-size: 14px; color: var(--ink-2); padding-inline: 6px; }
.ok-msg { color: var(--bull); font-weight: 500; } .bad-msg { color: var(--bear); font-weight: 500; }
.warn { color: var(--accent); font-weight: 500; font-size: 14px; }

/* Práctica */
.excards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.excard { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 0; border-radius: var(--r); padding: 18px; display: grid; gap: 6px; cursor: pointer; transition: transform .2s var(--ease), background .2s; }
.excard:hover { transform: translateY(-3px); background: #212226; }
.excard b { font-size: 17px; font-weight: 500; }
.excard span { color: var(--ink-2); font-size: 14px; }
.excard .exstat { font-size: 12.5px; color: var(--accent); }
.excard .bar, .tile .bar { display: block; height: 6px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.excard .bar > i, .tile .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #e9e9a9, #d5d6ef); border-radius: 999px; transform-origin: left; animation: grow 1s .2s var(--ease) backwards; }
.exrun { display: grid; gap: 14px; }
.exbar { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ink-2); }
.prompt { font-size: 20px; font-weight: 500; }
.fb { display: grid; gap: 12px; justify-items: start; }
.fb-box { padding: 14px 16px; border-radius: 20px; display: grid; gap: 4px; width: 100%; }
.fb-box.good { background: var(--good-bg); animation: pop .45s var(--ease); }
.fb-box.bad { background: var(--bad-bg); animation: shake .4s ease; }
.big { font-size: 76px; font-weight: 600; letter-spacing: -0.04em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; animation: pop .6s var(--ease) backwards; }
input[type=number], select, textarea { font: 15px var(--f-body); padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--ink); width: 100%; }
#calc-n { width: 150px; border-radius: 999px; }

/* Selector de temporalidad */
.tfbar { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); }
.tfbar button { font: 500 13px/1 var(--f-body); padding: 8px 12px; min-height: 34px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); cursor: pointer; transition: background .2s, color .2s; }
.tfbar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Simulador */
.sim { display: grid; gap: 12px; }
.sim-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.htf, .live { background: var(--surface); border-radius: var(--r); padding: 16px; }
.htf-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.htf-head .dg-tag { margin: 0; }
.htf-head .tfbar { background: var(--soft); }
.htf-head .tfbar button { padding: 6px 10px; min-height: 30px; }
.sim-stats { grid-column: 1 / -1; grid-row: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sim-stats > div { background: var(--surface); border-radius: 20px; padding: 12px 14px; display: grid; gap: 2px; }
.sim-stats span { font-size: 12px; color: var(--ink-2); }
.sim-stats b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.live h2 { font-size: 15px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
.live h2 span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); font-weight: 500; }
.live ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.live li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 14px; line-height: 1.3; align-items: center; }
.live li i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; border: 1.5px solid #3a3b40; color: transparent; transition: background .3s, border-color .3s; }
.live li.ok i { background: #c9ddc4; border-color: #c9ddc4; color: #16171a; animation: pop .4s var(--ease); }
.live li.wait i { background: #eeeda0; border-color: #eeeda0; color: #16171a; }
.live li small { display: block; color: var(--ink-2); font-size: 12px; }
@media (max-width: 600px) { .sim-top { grid-template-columns: 1fr; } .sim-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sim-tfrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sim-tfrow .dg-tag { margin: 0; }
.sim-tfrow .small { flex-basis: 100%; }
.sim-chart { border-radius: var(--r); }
.sim-ctrl .sp { flex: 1; }
.sim-ctrl .row { gap: 8px; }
.sim-ctrl .btn.buy, .sim-ctrl .btn.sell { min-width: 120px; min-height: 52px; font-size: 16px; }
@media (max-width: 600px) { .sim-ctrl .sp { flex-basis: 100%; height: 0; } .sim-ctrl .btn.buy, .sim-ctrl .btn.sell { flex: 1; } }
.order { box-shadow: inset 0 0 0 1px var(--line); animation: rise .35s var(--ease) backwards; }
.order.is-buy { box-shadow: inset 0 0 0 2px #e8e8a8; } .order.is-sell { box-shadow: inset 0 0 0 2px #d6d7ee; }
.order-head { display: grid; gap: 2px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.form-grid label { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.form-grid label.chk { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.order-sum { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
details.panel summary { cursor: pointer; font-weight: 500; }
.result { animation: rise .5s var(--ease) backwards; }
.result .res-head { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.result .res-head > div:last-child { flex: 1; min-width: 220px; display: grid; gap: 4px; }
.score { width: 116px; height: 116px; border-radius: 50%; display: grid; place-content: center; text-align: center; flex: none; animation: pop .6s var(--ease) backwards; }
.score b { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; } .score span { font-size: 11px; color: #3b3d35; }
.score.good { background: var(--grad); color: var(--on-accent); } .score.mid { background: #eeeda0; color: var(--on-accent); } .score.bad { background: #f1c6de; color: var(--on-accent); }
.grade { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.grade li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 18px; animation: rise .4s var(--ease) backwards; }
.grade li:nth-child(2) { animation-delay: 50ms; } .grade li:nth-child(3) { animation-delay: 100ms; } .grade li:nth-child(4) { animation-delay: 150ms; } .grade li:nth-child(5) { animation-delay: 200ms; } .grade li:nth-child(n+6) { animation-delay: 250ms; }
.grade li p { font-size: 13.5px; color: var(--ink-2); }
.grade li.ok { background: var(--good-bg); }
.grade li.mid { background: var(--mid-bg); }
.grade li.no { background: var(--bad-bg); }
.note-l { font-weight: 500; font-size: 14px; }
.empty { justify-items: start; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border-radius: 20px; padding: 16px; display: grid; gap: 4px; align-content: start; }
.tile > span { font-size: 12.5px; color: var(--ink-2); }
.tile b { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile b small { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.tile .sub { color: var(--ink-2); font-size: 12px; }

/* Teoría ampliada */
.lesson-bar { height: 5px; }
.th { gap: 10px; }
.th h2 { display: flex; align-items: center; gap: 10px; font-size: 18px; }
.th-n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; background: var(--soft); color: var(--accent); }
.th > p { color: #d4d5d8; font-size: 15.5px; line-height: 1.7; max-width: 66ch; }
.th .dg { margin-top: 4px; }
.th .dg-chart, .th .dg-card { background: var(--bg); }
.example { background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; border: 1.5px solid transparent; }
.example p { color: #d4d5d8; }
.rrbars { display: grid; gap: 10px; }
.rrbars > div { display: grid; grid-template-columns: 52px 1fr 48px; gap: 10px; align-items: center; font-size: 13px; }
.rr-bar { display: flex; height: 30px; border-radius: 999px; overflow: hidden; font-weight: 600; font-size: 12px; }
.rr-bar i { display: flex; align-items: center; justify-content: center; font-style: normal; color: var(--on-accent); transform-origin: left; animation: grow .8s var(--ease) backwards; }
.rr-bar .loss { background: #f1c6de; } .rr-bar .win { background: #c9ddc4; }
.rr-l { font-weight: 600; } .rr-w { text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: fl; }
.flow li { counter-increment: fl; position: relative; display: grid; gap: 2px; padding: 12px 14px 12px 50px; border-radius: 18px; background: var(--soft); }
.flow li::before { content: counter(fl); position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--bg); color: var(--ink-2); }
.flow li span { font-size: 13px; color: var(--ink-2); }
.flow li.go { background: var(--grad); color: var(--on-accent); }
.flow li.go::before { content: "✓"; background: rgba(22, 23, 26, .12); color: var(--on-accent); }
.flow li.go span { color: #3b3d35; }

/* Teléfonos */
button, .btn, a, .opt, .day, .act, .excard { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (max-width: 760px) {
  .tfbar button { min-height: 40px; padding: 8px 12px; }
  .sim { display: flex; flex-direction: column; }
  .sim-top { display: contents; }
  .sim-stats { order: 1; } .sim-tfrow { order: 2; } .sim-chart { order: 3; } .sim-ctrl { order: 4; } #sim-order { order: 5; } #sim-result { order: 6; } .live { order: 7; } .htf { order: 8; } .sim .settings { order: 9; }
  .sim-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .sim-stats > div { padding: 9px 10px; border-radius: 16px; }
  .sim-stats span { font-size: 10.5px; } .sim-stats b { font-size: 14.5px; }
  .sim-tfrow .small { display: none; }
  .page-head.slim .lead { display: none; }
  .th > p { font-size: 15px; }
  .actions { grid-template-columns: 1fr 1fr; } .actions .act:first-child { grid-column: 1 / -1; min-height: 96px; }
  .pager .btn { flex: 1; }
  .sim-ctrl .btn:not(.buy):not(.sell):not(.ghost) { flex: 1 1 28%; padding: 0 8px; font-size: 14px; }
}
@media (max-width: 400px) { #hdr-xp { display: none; } .logo b { font-size: 15px; } .sim-stats b { font-size: 13px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
