<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio IFVG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
/* Layout: terminal de estudio — barra superior fija, columna de lectura de 1040px, gráficos a todo el ancho de la columna. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --chart-bg: #fbfcfd; --ink: #142130; --ink-2: #536476; --line: #d3dbe3; --grid: #e7ecf1;
  --accent: #b97c00; --on-accent: #1a1300; --info: #2f6fd6; --on-info: #ffffff; --mute-c: #c9d3dd; --on-mute-c: #142130;
  --bull: #0e8a74; --bull-body: #d7f0ea; --bear: #cc4637;
  --good-bg: #e3f4ee; --bad-bg: #fbe8e5; --mid-bg: #fbf1d9;
  --f-display: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d141b; --surface: #141d27; --chart-bg: #111922; --ink: #e5ecf2; --ink-2: #93a3b3; --line: #253342; --grid: #1b2633;
  --accent: #f0b43a; --on-accent: #1a1300; --info: #6aa2ff; --on-info: #0b1420; --mute-c: #2c3a49; --on-mute-c: #e5ecf2;
  --bull: #2fc3a0; --bull-body: #12352f; --bear: #f2695b;
  --good-bg: #123128; --bad-bg: #3a1a17; --mid-bg: #352a12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d141b; --surface: #141d27; --chart-bg: #111922; --ink: #e5ecf2; --ink-2: #93a3b3; --line: #253342; --grid: #1b2633;
  --accent: #f0b43a; --on-accent: #1a1300; --info: #6aa2ff; --on-info: #0b1420; --mute-c: #2c3a49; --on-mute-c: #e5ecf2;
  --bull: #2fc3a0; --bull-body: #12352f; --bear: #f2695b;
  --good-bg: #123128; --bad-bg: #3a1a17; --mid-bg: #352a12; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--info); }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 13px; }
.muted { color: var(--ink-2); }
.pos { color: var(--bull); } .neg { color: var(--bear); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { font: 600 12px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.lead { font-size: 17px; color: var(--ink-2); max-width: 64ch; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand a.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo b { font: 800 19px/1 var(--f-display); font-stretch: 80%; letter-spacing: 0.01em; text-transform: uppercase; }
.logo svg { flex: none; }
.brand .sp { flex: 1; }
.chip { font: 500 12px/1 var(--f-mono); padding: 6px 9px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink-2); white-space: nowrap; }
.chip.acc { border-color: var(--accent); color: var(--ink); }
.nav { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 9px 12px 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 22px; }
main > * { min-width: 0; }
.page-head { display: grid; gap: 10px; }
.page-head.slim h1 { font-size: clamp(26px, 4vw, 36px); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.center { text-align: center; justify-items: center; }

.btn { font: 600 14px/1 var(--f-body); padding: 11px 16px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.buy { background: var(--bull); border-color: var(--bull); color: var(--surface); }
.btn.sell { background: var(--bear); border-color: var(--bear); color: var(--surface); }
.btn.ghost { background: transparent; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 28px; align-items: center; }
.hero-txt { display: grid; gap: 16px; }
.hero h1 { font-size: clamp(34px, 5.4vw, 56px); }
.hero-chart { min-width: 0; }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.tile > span { font: 500 12px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.tile b { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile b small { font-size: 15px; color: var(--ink-2); font-weight: 500; }
.tile .sub { color: var(--ink-2); font-size: 12px; }
.bar { display: block; height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.level-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.ladder { display: flex; gap: 4px; }
.ladder span { width: 30px; height: 30px; display: grid; place-items: center; font: 600 13px var(--f-mono); border: 1px solid var(--line); border-radius: 4px; color: var(--ink-2); }
.ladder span.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.reqs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.reqs li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 4px; background: var(--bg); }
.reqs li b { font: 500 13px var(--f-mono); white-space: nowrap; }
.reqs li.ok { background: var(--good-bg); }
.reqs li.ok span::before { content: "✓ "; color: var(--bull); font-weight: 700; }
.routine { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; counter-reset: r; }
.routine li { counter-increment: r; display: grid; gap: 4px; padding-top: 10px; border-top: 2px solid var(--line); }
.routine li b::before { content: counter(r) " · "; color: var(--accent); font-family: var(--f-mono); }
.routine span { color: var(--ink-2); font-size: 14px; }
@media (max-width: 760px) { .routine { grid-template-columns: 1fr 1fr; } }
.disclaimer { font-size: 12.5px; color: var(--ink-2); max-width: 80ch; }

/* Ruta */
.phase { display: grid; gap: 14px; padding-top: 6px; }
.phase-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.phase-head > div { display: grid; gap: 4px; }
.pill { font: 600 12px/1 var(--f-mono); padding: 5px 8px; border-radius: 3px; background: var(--grid); color: var(--ink-2); white-space: nowrap; justify-self: start; }
.pill.ok { background: var(--good-bg); color: var(--bull); }
.pill.mid { background: var(--mid-bg); color: var(--accent); }
.pill.no { background: var(--bad-bg); color: var(--bear); }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.day { display: grid; gap: 2px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; text-decoration: none; color: var(--ink); }
.day:hover { border-color: var(--ink-2); }
.day .dn { font: 500 11px var(--f-mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.day .dt { font-weight: 600; font-size: 14px; line-height: 1.3; }
.day.done { border-color: var(--bull); }
.day.done .dn::after { content: " · hecho"; color: var(--bull); }

.lesson { display: grid; gap: 22px; }
.crumbs { font-size: 13px; color: var(--ink-2); }
.crumbs a { color: var(--ink-2); }
.keys { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.keys li::marker { color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 10px; }

/* Diagramas */
.dg { display: grid; gap: 10px; min-width: 0; }
.dg-chart { overflow-x: auto; border: 1px solid var(--line); border-radius: 5px; background: var(--chart-bg); min-width: 0; }
.dg-chart svg { display: block; }
.dg-cap { font-size: 13.5px; color: var(--ink-2); max-width: 75ch; }
.dg-tag { font: 600 12px/1.3 var(--f-mono); color: var(--ink-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.dg-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.dg-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .dg-grid3, .dg-grid2 { grid-template-columns: 1fr; } }
.dg-card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 10px; min-width: 0; }
svg .axis { font: 10.5px var(--f-mono); fill: var(--ink-2); }
svg .lbl { font: 600 11px var(--f-body); paint-order: stroke; stroke: var(--chart-bg); stroke-width: 3px; stroke-linejoin: round; }
svg .lbl.num { font: 700 12px var(--f-mono); }
.anat { width: 100%; max-width: 420px; justify-self: center; }
.anat .lbl { stroke: var(--surface); }
.timeline { width: 100%; min-width: 560px; display: block; }
.timeline .lbl { stroke: none; }
.scroll-x { overflow-x: auto; min-width: 0; }
.road { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; counter-reset: rd; }
.road li { counter-increment: rd; display: grid; gap: 3px; padding: 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 4px 4px 0; }
.road li span { font: 500 12px var(--f-mono); color: var(--ink-2); }
.road li small { color: var(--ink-2); font-size: 13px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 600 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.note { color: var(--ink-2); max-width: 260px; }
.formula { font: 500 15px/1.8 var(--f-mono); }
.formula span { background: var(--bg); padding: 2px 6px; border-radius: 3px; }
ul.checks, ul.steps, ul.ok, ul.x { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.checks li::before { content: "☐  "; color: var(--accent); font-weight: 700; }
ul.steps { counter-reset: st; } ul.steps li { counter-increment: st; } ul.steps li::before { content: counter(st) ".  "; font-family: var(--f-mono); color: var(--accent); }
ul.ok li::before { content: "✓  "; color: var(--bull); font-weight: 700; }
ul.x li::before { content: "✕  "; color: var(--bear); font-weight: 700; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.vs > div { display: grid; gap: 8px; align-content: start; }
@media (max-width: 520px) { .vs { grid-template-columns: 1fr; } }
.plan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.plan > div { display: grid; gap: 2px; padding: 12px; background: var(--bg); border-radius: 4px; }
.plan b { font: 800 26px/1 var(--f-display); font-stretch: 85%; }
.plan span { font-size: 13px; color: var(--ink-2); }
@media (max-width: 620px) { .plan { grid-template-columns: 1fr 1fr; } }
.steps3, .three { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.steps3 li { display: grid; gap: 4px; padding: 12px; background: var(--bg); border-radius: 4px; }
.steps3 li span { font-size: 13px; color: var(--ink-2); }
@media (max-width: 680px) { .steps3, .three { grid-template-columns: 1fr; } }
.split { display: flex; height: 44px; border-radius: 4px; overflow: hidden; font: 600 13px var(--f-mono); }
.split > div { display: grid; place-items: center; }
.split .s1 { background: var(--mute-c); color: var(--on-mute-c); } .split .s2 { background: var(--accent); color: var(--on-accent); } .split .s3 { background: var(--info); color: var(--on-info); }

/* Estrategia */
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.k { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: 800 17px var(--f-display); flex: none; }
.model-head { display: flex; gap: 12px; align-items: center; }

/* Quiz */
.qform { display: grid; gap: 16px; }
.qform fieldset { border: 1px solid var(--line); border-radius: 5px; padding: 12px 14px 14px; margin: 0; display: grid; gap: 6px; min-width: 0; }
.qform legend { font-weight: 600; padding: 0 4px; }
.qform fieldset.good { border-color: var(--bull); background: var(--good-bg); }
.qform fieldset.bad { border-color: var(--bear); background: var(--bad-bg); }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.opt:hover { background: var(--bg); }
.opt input { margin-top: 5px; accent-color: var(--accent); }
.exp { font-size: 14px; color: var(--ink-2); }
.ok-msg { color: var(--bull); font-weight: 600; } .bad-msg { color: var(--bear); font-weight: 600; }
.warn { color: var(--accent); font-weight: 600; font-size: 14px; }

/* Práctica */
.excards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.excard { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 6px; cursor: pointer; }
.excard:hover { border-color: var(--accent); }
.excard b { font: 700 18px var(--f-display); font-stretch: 88%; }
.excard span { color: var(--ink-2); font-size: 14px; }
.excard .exstat { font: 500 12px var(--f-mono); }
.exrun { display: grid; gap: 14px; }
.exbar { display: flex; justify-content: space-between; font: 500 13px var(--f-mono); color: var(--ink-2); }
.prompt { font-size: 22px; }
.fb { display: grid; gap: 12px; justify-items: start; }
.fb-box { padding: 12px 14px; border-radius: 5px; border: 1px solid; display: grid; gap: 4px; width: 100%; }
.fb-box.good { background: var(--good-bg); border-color: var(--bull); }
.fb-box.bad { background: var(--bad-bg); border-color: var(--bear); }
.big { font-size: 72px; }
input[type=number], select, textarea { font: 15px var(--f-body); padding: 9px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); width: 100%; }
#calc-n { width: 140px; }

/* Simulador */
.sim { display: grid; gap: 12px; }
.sim-top { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 12px; align-items: stretch; }
.htf { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.htf .dg-tag { margin: 0 0 4px; }
.sim-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; align-content: start; }
.sim-stats > div { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
.sim-stats span { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.sim-stats b { font: 700 18px var(--f-display); font-variant-numeric: tabular-nums; }
@media (max-width: 680px) { .sim-top { grid-template-columns: 1fr; } }
.sim-ctrl .sp { flex: 1; }
.order { border-width: 2px; }
.order.is-buy { border-color: var(--bull); } .order.is-sell { border-color: var(--bear); }
.order-head { display: grid; gap: 2px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.form-grid label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.form-grid label.chk { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.order-sum { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; }
.settings summary, details.panel summary { cursor: pointer; font-weight: 600; }
.result .res-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.result .res-head > div:last-child { flex: 1; min-width: 220px; display: grid; gap: 4px; }
.score { width: 112px; height: 112px; border-radius: 50%; display: grid; place-content: center; text-align: center; border: 6px solid; flex: none; }
.score b { font: 800 38px/1 var(--f-display); } .score span { font-size: 11px; color: var(--ink-2); }
.score.good { border-color: var(--bull); } .score.mid { border-color: var(--accent); } .score.bad { border-color: var(--bear); }
.grade { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.grade li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 4px; border-left: 4px solid; }
.grade li p { font-size: 14px; color: var(--ink-2); }
.grade li.ok { background: var(--good-bg); border-color: var(--bull); }
.grade li.mid { background: var(--mid-bg); border-color: var(--accent); }
.grade li.no { background: var(--bad-bg); border-color: var(--bear); }
.note-l { font-weight: 600; font-size: 14px; }
.empty { justify-items: start; }
.tfbar { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--surface); }
.tfbar button { font: 600 12px/1 var(--f-mono); padding: 7px 10px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink-2); cursor: pointer; }
.tfbar button:last-child { border-right: 0; }
.tfbar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dg-tools { display: flex; justify-content: flex-end; }
.sim-tfrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sim-tfrow .dg-tag { margin: 0; }
.htf-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.htf-head .dg-tag { margin: 0; }
.htf-head .tfbar button { padding: 5px 8px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
