<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161316">
<meta name="description" content="Aprende la estrategia del bootcamp: 50 lecciones, práctica evaluada y simulador.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lab IFVG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Laboratorio IFVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap">
<style>
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
/* Layout: app móvil oscura y suave — una columna de 760px, tarjetas muy redondeadas, botones píldora y un degradado naranja sobre negro cálido para lo importante. Un solo tema oscuro, elegido a propósito. */
:root {
  --bg: #161316; --surface: #1e1a1c; --soft: #282224; --chart-bg: #1a1618; --brown: #453027;
  --ink: #f6f2ef; --ink-2: #bababa; --line: #3a3033; --grid: #241f21;
  --accent: #ff6d29; --on-accent: #161316; --info: #f5b993; --on-info: #161316;
  --mute-c: #3a3033; --on-mute-c: #f6f2ef;
  --bull: #8fd9a8; --bear: #ff5c6c; --bull-body: #8fd9a8;
  --c-up: #f4efec; --c-up-body: #f4efec; --c-down: #ff6d29; --c-down-body: transparent;
  --good-bg: #1d2a21; --bad-bg: #3a1b1f; --mid-bg: #453027;
  --grad: linear-gradient(135deg, #ffa36b 0%, #ff7a38 45%, #ff6d29 100%);
  --glow: radial-gradient(120% 90% at 0% 0%, rgba(255, 109, 41, .13), transparent 55%);
  --edge: rgba(255, 255, 255, .07);
  --r: 24px; --ease: cubic-bezier(.2, .7, .2, 1);
  --f-body: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Inter Tight', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.65 var(--f-body); letter-spacing: 0.003em; -webkit-font-smoothing: antialiased; }
html, body { overflow-x: clip; }
a { color: var(--info); text-underline-offset: 3px; }
h1, h2, h3 { line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.02em; font-weight: 500; }
h1 { font-size: clamp(28px, 6vw, 36px); }
h2 { font-size: 18px; }
h3 { font-size: 16px; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 13px; }
.muted { color: var(--ink-2); }
.pos { color: var(--bull); } .neg { color: var(--bear); } .acc-t { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--accent); }
.lead { font-size: 17px; line-height: 1.6; color: #cbc5c2; max-width: 58ch; }

/* Animaciones: el estado final es el visible; la animación solo parte desde oculto */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes cdl { from { opacity: 0; transform: scaleY(.15); } }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes shimmer { 0% { background-position: 0% 30%; } 100% { background-position: 100% 70%; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 50% { transform: translateY(-6px) rotate(var(--rot, 0deg)); } }
@keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 109, 41, .45); } 100% { box-shadow: 0 0 0 10px rgba(255, 109, 41, 0); } }
main > * { animation: rise .55s var(--ease) backwards; }
main > *:nth-child(2) { animation-delay: 60ms; } main > *:nth-child(3) { animation-delay: 120ms; } main > *:nth-child(4) { animation-delay: 180ms; }
main > *:nth-child(5) { animation-delay: 240ms; } main > *:nth-child(6) { animation-delay: 300ms; } main > *:nth-child(n+7) { animation-delay: 360ms; }
svg .cdl { animation: cdl .45s var(--ease) backwards; transform-box: fill-box; transform-origin: 50% 100%; }
svg .ln { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.3s ease-out backwards; }

/* Barra superior y navegación */
.top { position: sticky; top: var(--stick, 0px); padding-top: var(--sat, env(safe-area-inset-top, 0px)); z-index: 5; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top-in { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: contents; }
.brand a.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
.logo b { font-weight: 600; font-size: 16px; }
.brand .sp { display: none; }
.chips { order: 4; display: flex; gap: 6px; }
.chip { font: 500 12.5px/1 var(--f-body); padding: 9px 12px; border-radius: 999px; background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.chip.acc { color: var(--accent); }
.nav { order: 3; position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); margin-left: auto; }
.nav a { position: relative; z-index: 1; padding: 8px 13px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; border-radius: 999px; white-space: nowrap; transition: color .3s; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--bg); }
/* píldora que se desliza hasta la sección activa */
.nav-ind { position: absolute; z-index: 0; left: 0; top: 0; width: 0; height: 0; border-radius: 999px; background: var(--ink); transition: transform .42s cubic-bezier(.3, .9, .2, 1), width .42s cubic-bezier(.3, .9, .2, 1), height .3s; will-change: transform; }
.nav.instant .nav-ind { transition: none; }
/* cambio de pantalla: salida rápida y entrada escalonada */
main { transition: opacity .14s ease, transform .14s ease; }
main.out { opacity: 0; transform: translateY(-6px); }
.act:active, .day:active, .excard:active, .g-card:active { transform: scale(.98); }
.nav a svg { display: none; }
@media (max-width: 760px) {
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); } /* el blur crearía un contenedor para la barra fija */
  .chips { margin-left: auto; }
  /* barra de pestañas pegada al borde inferior, como en una app nativa */
  .nav { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; margin: 0; justify-content: space-between; gap: 0; border-radius: 22px 22px 0 0; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 -8px 30px rgba(0, 0, 0, .35); border-top: 1px solid rgba(255, 255, 255, .04); }
  .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; font-size: 10.5px; min-height: 52px; justify-content: center; }
  .nav a svg { display: block; transition: transform .3s cubic-bezier(.3, .9, .2, 1); }
  .nav a[aria-current="page"] svg { transform: translateY(-1px) scale(1.06); }
  .nav-ind { border-radius: 18px; }
  .nav { transform: translateZ(0); }
  .nav::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 140px; background: var(--surface); }
  body.in-sim .nav { display: none; }
  body.in-sim main { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) !important; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important; }
}
body.onb .top, body.onb .nav { display: none; }

main { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 72px; display: grid; gap: 14px; }
main > * { min-width: 0; }
.page-head { display: grid; gap: 8px; padding: 16px 4px 6px; }
.page-head.slim h1 { font-size: clamp(26px, 5vw, 32px); }
.panel, .card { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-head.line { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.center { text-align: center; justify-items: center; }

.btn { font: 600 15px/1 var(--f-body); padding: 0 20px; min-height: 48px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .15s var(--ease), opacity .2s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.buy { background: var(--grad); color: var(--on-accent); border: 0; }
.btn.sell { background: transparent; color: var(--ink); border-color: #453b3e; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.wide { width: 100%; min-height: 54px; font-size: 16px; }
.link { font: 500 15px var(--f-body); color: var(--ink-2); background: none; border: 0; cursor: pointer; min-height: 44px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Bienvenida */
.welcome { min-height: calc(100svh - 40px); display: flex; flex-direction: column; gap: 22px; padding-top: 12px; position: relative; max-width: 480px; width: 100%; justify-self: center; }
.welcome::before, .welcome::after { content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%; z-index: -1; pointer-events: none; }
.welcome::before { left: -110px; top: 90px; background: radial-gradient(circle, rgba(255, 109, 41, .2), transparent 70%); }
.welcome::after { right: -130px; top: 240px; background: radial-gradient(circle, rgba(245, 185, 147, .17), transparent 70%); }
.w-top { display: flex; justify-content: space-between; align-items: center; }
.w-vis { position: relative; min-height: 330px; display: grid; place-items: center; animation: rise .6s var(--ease) backwards; }
.w-txt { margin-top: auto; display: grid; gap: 16px; animation: rise .6s .1s var(--ease) backwards; }
.w-txt h1 { font-size: 32px; }
.dots { display: flex; gap: 6px; }
.dots span { width: 6px; height: 6px; border-radius: 3px; background: #574a4d; transition: width .3s var(--ease); }
.dots span.on { width: 20px; background: var(--ink); }
.float-card { width: min(320px, 100%); padding: 16px; border-radius: 26px; background: rgba(40, 34, 36, .94); border: 1px solid rgba(255, 255, 255, .06); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); display: grid; gap: 10px; animation: bob 6s ease-in-out infinite; }
.float-card #w-chart { border-radius: 14px; overflow: hidden; }
.fc-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); }
.tag { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); }
.fc-msg { font-size: 13px; color: #c4bebb; padding: 10px 14px; border-radius: 999px; background: #3a3033; }
.w-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
.w-brand svg { width: 36px; height: 36px; filter: drop-shadow(0 8px 18px rgba(255, 109, 41, .18)); }
.float-tag { position: absolute; right: 4%; bottom: 8px; --rot: 3deg; padding: 10px 14px; border-radius: 16px; background: var(--grad); color: var(--on-accent); font-size: 13px; font-weight: 600; box-shadow: 0 14px 30px rgba(0, 0, 0, .4); animation: bob 5s .6s ease-in-out infinite; }
.w-steps { display: grid; gap: 10px; width: min(340px, 100%); }
.w-steps > div { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; padding: 14px 16px; border-radius: 22px; background: var(--surface); animation: rise .5s var(--ease) backwards; }
.w-steps > div:nth-child(2) { animation-delay: .1s; margin-left: 18px; } .w-steps > div:nth-child(3) { animation-delay: .2s; margin-left: 36px; background: var(--grad); color: var(--on-accent); }
.w-steps i { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 600; background: var(--soft); color: var(--ink); }
.w-steps > div:nth-child(3) i { background: rgba(22, 19, 22, .12); color: var(--on-accent); }
.w-steps span { font-size: 13px; opacity: .75; }
.w-score { display: grid; justify-items: center; gap: 16px; }
.ring { width: 150px; height: 150px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: radial-gradient(closest-side, var(--bg) 82%, transparent 83%), conic-gradient(#ff6d29 0 92%, var(--soft) 0); animation: pop .7s var(--ease) backwards; }
.ring b { font-size: 48px; font-weight: 600; line-height: 1; } .ring span { font-size: 12px; color: var(--ink-2); }
.w-score ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.w-score li { padding: 7px 12px; border-radius: 999px; background: var(--good-bg); color: var(--bull); font-size: 13px; }
.w-score li.warn-i { background: var(--mid-bg); color: var(--accent); }

/* Inicio */
.g-hero { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 22px max(16px, env(safe-area-inset-left, 0px)) 18px; border-radius: 0 0 34px 34px; background: var(--grad); background-size: 220% 220%; animation: rise .55s var(--ease) backwards, shimmer 14s ease-in-out infinite alternate; color: var(--on-accent); display: grid; gap: 18px; }
@media (min-width: 761px) { .g-hero { margin: 0; border-radius: 34px; padding: 26px; } }
.g-hero h1 { font-size: clamp(30px, 6vw, 38px); font-weight: 400; }
.g-hero h1 b { font-weight: 700; }
.g-row { display: flex; }
.pill-dark { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; background: #1e1a1c; color: #f6f2ef; font-size: 13px; font-weight: 500; }
.pill-dark i { width: 7px; height: 7px; border-radius: 50%; background: #7d7173; }
.pill-dark.live i { background: #8fd9a8; animation: pulse 1.6s infinite; }
.lvl-card { border-radius: 24px; background: #1e1a1c; color: #f6f2ef; padding: 18px 20px; display: grid; gap: 12px; }
.lvl-card > small { color: var(--ink-2); font-size: 12.5px; }
.lvl-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.lvl-top > span:first-child { display: grid; }
.lvl-top small { font-size: 13px; color: var(--ink-2); }
.lvl-top b { font-size: 22px; font-weight: 600; }
.xp { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.xp small { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.gbar { display: block; height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.gbar.big { height: 18px; background: var(--bg); }
.gbar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ff6d29, #f5b993); transform-origin: left; animation: grow 1s .25s var(--ease) backwards; }
.card.rows { padding: 6px 20px; gap: 0; }
.rows > div { display: flex; justify-content: space-between; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.rows > div:last-child { border-bottom: 0; }
.rows span { color: #c4bebb; } .rows b { font-weight: 600; }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.act { min-height: 128px; border-radius: 22px; background: var(--surface); padding: 14px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; transition: transform .2s var(--ease), background .2s; }
.act:hover { transform: translateY(-3px); background: #1b1719; }
.act i { align-self: flex-end; width: 28px; height: 28px; border-radius: 50%; border: 1.6px solid currentColor; display: grid; place-items: center; font-style: normal; font-weight: 600; }
.act span { display: grid; }
.act small { font-size: 12px; color: var(--ink-2); }
.act b { font-size: 18px; font-weight: 500; }
.act em { font-style: normal; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act.acc i, .act.acc small { color: var(--accent); } .act.lav i { color: var(--info); }
.pbars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pbars > div { height: 120px; border-radius: 16px; background: var(--soft); position: relative; display: flex; justify-content: center; overflow: hidden; }
.pbars span { position: absolute; top: 9px; font-size: 12px; color: #c4bebb; }
.pbars i { position: absolute; left: 6px; right: 6px; bottom: 6px; height: calc(var(--h) * .68); border-radius: 11px; transform-origin: bottom; animation: growY .8s var(--ease) backwards; }
.pbars i.g, .legend i.g { background: #8fd9a8; } .pbars i.y, .legend i.y { background: #f5c76a; } .pbars i.p, .legend i.p { background: #ff8f99; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: flex; align-items: center; gap: 6px; } .legend i { width: 9px; height: 9px; border-radius: 3px; }
.reqs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reqs li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--soft); font-size: 14.5px; }
.reqs li b { font: 500 13px var(--f-mono); white-space: nowrap; color: var(--ink-2); }
.reqs li.ok { background: var(--good-bg); }
.reqs li.ok span::before { content: "✓  "; color: var(--bull); font-weight: 700; }
.disclaimer { font-size: 13px; line-height: 1.6; color: #a09895; max-width: 78ch; padding: 4px; }

/* Ruta */
.g-card { position: relative; display: grid; gap: 2px; padding: 22px; min-height: 110px; align-content: end; border-radius: var(--r); background: var(--grad); background-size: 200% 200%; animation: rise .55s var(--ease) backwards, shimmer 14s ease-in-out infinite alternate; color: var(--on-accent); text-decoration: none; transition: transform .2s var(--ease); }
.g-card:hover { transform: translateY(-2px); }
.g-card small { font-size: 13px; color: #3a1a0c; } .g-card b { font-size: 21px; font-weight: 600; }
.g-card i { position: absolute; right: 18px; top: 18px; width: 30px; height: 30px; border-radius: 50%; border: 1.6px solid var(--on-accent); display: grid; place-items: center; font-style: normal; font-size: 18px; }
.phase { gap: 12px; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 15px; }
.stats3 span { display: grid; } .stats3 small { font-size: 12px; color: var(--ink-2); } .stats3 b { font-weight: 500; }
.pill { font: 500 12px/1 var(--f-body); padding: 7px 11px; border-radius: 999px; background: var(--soft); color: var(--ink-2); white-space: nowrap; justify-self: start; }
.pill.ok { background: var(--good-bg); color: var(--bull); }
.pill.mid { background: var(--mid-bg); color: var(--accent); }
.pill.no { background: var(--bad-bg); color: var(--bear); }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.day { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 10px 12px; background: var(--soft); border-radius: 16px; text-decoration: none; color: var(--ink); transition: transform .15s var(--ease), background .2s; }
.day:hover { transform: translateY(-2px); background: #3a3033; }
.day .dn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; background: var(--bg); color: var(--ink-2); }
.day .dt { font-weight: 500; font-size: 13.5px; line-height: 1.3; }
.day.done .dn { background: #8fd9a8; color: #161316; }
.day.now .dn { background: var(--accent); color: var(--on-accent); animation: pulse 1.8s infinite; }

.lesson { display: grid; gap: 16px; }
.crumbs { font-size: 13.5px; color: var(--ink-2); }
.crumbs a { color: var(--ink-2); }
.keys { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 16px; line-height: 1.6; color: #efe9e5; }
.keys li::marker { color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 10px; }

/* Diagramas */
.dg { display: grid; gap: 10px; min-width: 0; }
.dg-chart { overflow-x: auto; border-radius: 20px; background: var(--chart-bg); min-width: 0; }
.dg-chart svg { display: block; }

/* Cuestionarios */

/* Práctica */

.excard .bar > i, .tile .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #ff6d29, #f5b993); border-radius: 999px; transform-origin: left; animation: grow 1s .2s var(--ease) backwards; }

input[type=number], select, textarea { font: 15px var(--f-body); padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--ink); width: 100%; }
#calc-n { width: 150px; border-radius: 999px; }

/* Selector de temporalidad */

.sim { display: grid; gap: 12px; }
.sim-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.htf, .live { background: var(--surface); border-radius: var(--r); padding: 16px; }

@media (max-width: 600px) { .sim-top { grid-template-columns: 1fr; } .sim-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.sim-tfrow .small { flex-basis: 100%; }
.sim-chart { border-radius: var(--r); }
.sim-ctrl .sp { flex: 1; }
.sim-ctrl .row { gap: 8px; }

@media (max-width: 600px) { .sim-ctrl .sp { flex-basis: 100%; height: 0; } .sim-ctrl .btn.buy, .sim-ctrl .btn.sell { flex: 1; } }
.order { box-shadow: inset 0 0 0 1px var(--line); animation: rise .35s var(--ease) backwards; }
.order.is-buy { box-shadow: inset 0 0 0 2px #ff6d29; } .order.is-sell { box-shadow: inset 0 0 0 2px #f5b993; }
.order-head { display: grid; gap: 2px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

.order-sum { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
details.panel summary { cursor: pointer; font-weight: 500; }
details.card > summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; min-height: 40px; }
.result { animation: rise .5s var(--ease) backwards; }

.score b { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; } .score span { font-size: 11px; color: #3a1a0c; }
.score.good { background: var(--grad); color: var(--on-accent); } .score.mid { background: #f5c76a; color: var(--on-accent); } .score.bad { background: #ff8f99; color: var(--on-accent); }
.grade { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.grade li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 18px; animation: rise .4s var(--ease) backwards; }
.grade li:nth-child(2) { animation-delay: 50ms; } .grade li:nth-child(3) { animation-delay: 100ms; } .grade li:nth-child(4) { animation-delay: 150ms; } .grade li:nth-child(5) { animation-delay: 200ms; } .grade li:nth-child(n+6) { animation-delay: 250ms; }
.grade li p { font-size: 14.5px; line-height: 1.5; color: #d6d0cc; }
.grade li.ok { background: var(--good-bg); }
.grade li.mid { background: var(--mid-bg); }
.grade li.no { background: var(--bad-bg); }
.note-l { font-weight: 500; font-size: 14px; }
.empty { justify-items: start; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border-radius: 20px; padding: 16px; display: grid; gap: 4px; align-content: start; }
.tile > span { font-size: 12.5px; color: var(--ink-2); }

.tile .sub { color: var(--ink-2); font-size: 12px; }

/* Teoría ampliada */
.lesson-bar { height: 5px; }
.th { gap: 10px; }
.th h2 { display: flex; align-items: center; gap: 10px; font-size: 18px; }

.example { background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; border: 1.5px solid transparent; }
.example p { color: #efe9e5; font-size: 16px; line-height: 1.7; }

.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: fl; }

.flow li::before { content: counter(fl); position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--bg); color: var(--ink-2); }

/* Teléfonos */
button, .btn, a, .opt, .day, .act, .excard { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (max-width: 760px) {

  .sim { display: flex; flex-direction: column; }
  .sim-top { display: contents; }
  .sim-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .sim-stats > div { padding: 9px 10px; border-radius: 16px; }
  .sim-stats span { font-size: 10.5px; } .sim-stats b { font-size: 14.5px; }

}
@media (max-width: 400px) { #hdr-xp { display: none; } .logo b { font-size: 15px; } .sim-stats b { font-size: 13px; } }

/* Pantalla de carga: se oculta sola a los 4 s aunque falle el script */
#splash { position: fixed; inset: 0; z-index: 50; background: #161316; display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); animation: sp-auto 0.4s 5s forwards; transition: opacity .45s ease, visibility .45s; }
#splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
#splash.done .sp-center { transform: scale(1.04); }
.sp-glow { position: absolute; inset: 0; background: radial-gradient(40% 30% at 30% 40%, rgba(255, 109, 41, .16), transparent 70%), radial-gradient(40% 30% at 72% 62%, rgba(245, 185, 147, .14), transparent 70%); animation: sp-breathe 3s ease-in-out infinite alternate; }
.sp-center { position: relative; display: grid; justify-items: center; gap: 10px; transition: transform .45s ease; }
.sp-logo { width: 104px; height: 104px; filter: drop-shadow(0 16px 36px rgba(255, 109, 41, .22)); animation: sp-pop .6s cubic-bezier(.2, .8, .2, 1.2) both; }
.sp-band { transform-box: fill-box; transform-origin: left center; animation: sp-grow .5s .45s cubic-bezier(.2, .7, .2, 1) both; }
.sp-c1 { transform-box: fill-box; transform-origin: 50% 100%; animation: sp-rise .5s .25s cubic-bezier(.2, .7, .2, 1) both; }
.sp-c2 { transform-box: fill-box; transform-origin: 50% 100%; animation: sp-rise .55s .6s cubic-bezier(.2, .8, .2, 1.15) both; }
.sp-name { margin: 8px 0 0; font: 600 22px var(--f-body); letter-spacing: -0.01em; color: #f6f2ef; animation: rise .5s .7s var(--ease) both; }
.sp-tag { margin: 0; font: 400 13.5px var(--f-body); color: #a29a97; animation: rise .5s .85s var(--ease) both; }
.sp-bar { position: absolute; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); width: 140px; height: 4px; margin-left: -70px; border-radius: 999px; background: #282224; overflow: hidden; }
.sp-bar i { display: block; height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #ff6d29, #f5b993); transform-origin: left; animation: sp-load 1.1s .2s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes sp-pop { from { opacity: 0; transform: scale(.7); } }
@keyframes sp-rise { from { opacity: 0; transform: scaleY(.1); } }
@keyframes sp-grow { from { opacity: 0; transform: scaleX(0); } }
@keyframes sp-load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes sp-breathe { from { opacity: .6; } to { opacity: 1; } }
@keyframes sp-auto { to { opacity: 0; visibility: hidden; pointer-events: none; } }

/* Simulador: panel de botones y hoja de la orden */
.sim-ctrl { display: grid; gap: 8px; }
.dock-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dock-row.trade .end { margin-left: auto; }
.btn.speed { min-width: 52px; padding: 0 12px; font-variant-numeric: tabular-nums; }
.btn.play { min-width: 128px; }
.order.sheet { display: grid; gap: 12px; padding: 16px; border-radius: 24px; background: var(--surface); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-head > span { display: grid; } .sheet-head b { font-size: 17px; } .sheet-head small { color: var(--ink-2); font-size: 13px; }

.hint { font-size: 14.5px; color: #d6d0cc; margin: 0; }
.steppers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepper { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 4px; align-items: center; }
.stepper > span { grid-column: 1 / -1; font-size: 13px; font-weight: 600; }
.stepper.sl > span { color: var(--bear); } .stepper.tp > span { color: var(--bull); }
.stepper input { min-height: 46px; min-width: 0; width: 100%; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: center; font: 600 14px var(--f-mono); padding: 0 2px; }
.stepper input::placeholder { color: #7c7471; font: 400 12.5px var(--f-body); }
.st-b { min-height: 46px; padding: 0; border-radius: 14px; border: 0; background: var(--soft); color: var(--ink); font-size: 22px; font-weight: 500; cursor: pointer; }
.st-b:active { transform: scale(.94); background: #3d3336; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-b { min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px dashed #574a4d; background: transparent; color: var(--accent); font: 500 13px var(--f-body); cursor: pointer; }

.panel, .card, .excard, .act, .lvl-card, .plan-item, .jrow, .gitem, .day, .reqs li { border: 1px solid var(--edge); }
.panel, .card, .excard, .act { background: var(--glow), var(--surface); }
.card, .panel { border-radius: 28px; }
.btn { border-color: var(--edge); }
.btn.pri, .btn.buy { background: var(--grad); color: var(--on-accent); border: 0; box-shadow: 0 8px 24px rgba(255, 109, 41, .25); }
.btn.sell { border: 1.5px solid var(--line); }
.pill.mid { background: var(--brown); color: #ffb48a; }
.chip { border: 1px solid var(--edge); }
.chip.acc { color: #ffb48a; }
/* Hoy: héroe con brillo naranja como la tarjeta de referencia */
.g-hero { background: radial-gradient(120% 120% at 0% 100%, #ff6d29 0%, #c4501a 22%, #6b3a22 45%, var(--brown) 62%, #1e1719 100%) !important; color: #fff !important; animation: rise .55s var(--ease) backwards !important; border: 1px solid rgba(255, 255, 255, .06); border-top: 0; }
.g-hero h1 { color: rgba(255, 255, 255, .62); font-weight: 500; }
.g-hero h1 b { color: #fff; }
.g-hero h1 b { font-weight: 600; }
.g-hero .pill-dark { background: rgba(22, 19, 22, .55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.lvl-card { background: rgba(22, 19, 22, .72) !important; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.gbar i, .gbar > i { background: var(--grad) !important; }
.g-card { background: radial-gradient(130% 130% at 100% 0%, #ff8a4c 0%, #ff6d29 35%, #c4501a 100%) !important; }
/* Barra inferior: oscura, el activo en naranja */
.nav { background: rgba(30, 26, 28, .94) !important; border: 1px solid var(--edge); }
.nav a[aria-current="page"] { color: var(--accent) !important; }
.nav-ind { background: rgba(255, 109, 41, .12) !important; box-shadow: inset 0 0 0 1px rgba(255, 109, 41, .25); }
/* Simulador */
.sx-player .play { background: var(--accent) !important; color: var(--on-accent) !important; box-shadow: 0 0 0 6px rgba(255, 109, 41, .14), 0 10px 30px rgba(255, 109, 41, .35); }
.sx-chartwrap { border: 1px solid var(--edge); }
.score.good { background: var(--grad) !important; }
/* Evaluar */
.sx-player .end { color: var(--accent); border: 1.5px solid rgba(255, 109, 41, .45) !important; background: transparent; padding: 0 12px; }
.sx-closed { display: grid; gap: 10px; padding: 16px; border-radius: 22px; background: var(--glow), var(--surface); border: 1px solid var(--edge); animation: rise .35s var(--ease) backwards; }
.sx-closed .link { justify-self: center; }
.practice-cta { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; border-color: rgba(255, 109, 41, .3) !important; }
.practice-cta > div { display: grid; gap: 2px; } .practice-cta b { font-size: 17px; font-weight: 600; } .practice-cta p { margin: 0; }
.fb-box a, .grade a { display: inline-block; margin-top: 6px; color: var(--accent); }
/* Cuenta */
.acct-chip { position: relative; width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--edge); color: var(--ink-2); overflow: visible; }
.acct-chip[hidden] { display: none; }
.acct-chip img, .acct-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.acct-chip.ok::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--bull); box-shadow: 0 0 0 2px var(--bg); }
.acct-row { display: flex; align-items: center; gap: 12px; }
.acct-av { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--brown); color: #ffb48a; overflow: hidden; }
.acct-t { display: grid; line-height: 1.3; } .acct-t b { font-weight: 600; font-size: 17px; } .acct-t small { color: var(--ink-2); font-size: 13px; }
.acct-t small.ok { color: var(--bull); } .acct-t small.warn { color: #ffc46b; }
.acct p { margin: 0; } .acct .btn { justify-self: start; }
.chips { display: flex; align-items: center; gap: 8px; }
/* Pantalla de carga */
#splash { background: radial-gradient(70% 50% at 0% 100%, rgba(255, 109, 41, .35), transparent 70%), #161316 !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
