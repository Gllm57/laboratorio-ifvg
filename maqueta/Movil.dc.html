<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simulador móvil · Laboratorio IFVG</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B1117}
a{color:#F0B43A}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1117; color: #E6EDF3; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Main.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; border: 1px solid #1F2B38; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="#E6EDF3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <div style="display: flex; flex-direction: column; flex: 1; line-height: 1.25">
        <span style="font-family: Archivo, sans-serif; font-stretch: 82%; font-weight: 800; font-size: 20px">NQ · sesión #24</span>
        <span style="font-size: 12px; color: #2FC3A0; font-weight: 600">Ventana abierta · quedan 79 min</span>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">9:41</span>
    </div>
    <div role="group" aria-label="Temporalidad" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid #2A3746; border-radius: 8px; overflow: hidden">
      <sc-for list="{{tfs}}" as="t" hint-placeholder-count="5">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <section aria-label="Gráfico" style="position: relative; margin: 0 16px; height: 300px; border-radius: 8px; background: #0E151D; border: 1px solid #1F2B38; overflow: hidden">
    <div style="position: absolute; left: 6px; right: 58px; top: 12px; bottom: 12px; display: flex; gap: 2px">
      <sc-for list="{{candles}}" as="c" hint-placeholder-count="28">
        <div style="position: relative; flex: 1"><div style="{{c.wick}}"></div><div style="{{c.body}}"></div></div>
      </sc-for>
      <div style="flex: 4"></div>
    </div>
    <sc-for list="{{marks}}" as="m" hint-placeholder-count="4">
      <div style="{{m.style}}"><span style="{{m.labelStyle}}">{{m.label}}</span></div>
    </sc-for>
    <span style="position: absolute; right: 4px; top: 45%; padding: 2px 5px; border-radius: 3px; background: #2FC3A0; color: #0B1117; font: 600 10.5px 'IBM Plex Mono', monospace">20.428,75</span>
  </section>

  <section aria-label="Checklist" style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 600">Checklist</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #F0B43A">3/6 · falta el IFVG</span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="6">
        <span style="{{c.style}}">{{c.label}}</span>
      </sc-for>
    </div>
  </section>

  <section style="margin-top: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; background: #0F161E; border-top: 1px solid #1F2B38">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 44px; border-radius: 8px; border: 1px solid #2A3746; background: #121A23; color: #E6EDF3; font: 600 14px 'IBM Plex Sans', sans-serif">Reproducir</button>
      <button type="button" style="min-height: 44px; border-radius: 8px; border: 1px solid #2A3746; background: #121A23; color: #E6EDF3; font: 600 14px 'IBM Plex Sans', sans-serif">+1 min</button>
      <button type="button" style="min-height: 44px; border-radius: 8px; border: 1px solid #2A3746; background: #121A23; color: #E6EDF3; font: 600 14px 'IBM Plex Sans', sans-serif">+1 vela</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 52px; border-radius: 8px; border: 0; background: #2FC3A0; color: #0B1117; font: 700 16px 'IBM Plex Sans', sans-serif">Comprar</button>
      <button type="button" style="min-height: 52px; border-radius: 8px; border: 0; background: #F2695B; color: #0B1117; font: 700 16px 'IBM Plex Sans', sans-serif">Vender</button>
    </div>
  </section>

  <nav aria-label="Secciones" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 14px; background: #0F161E; border-top: 1px solid #1F2B38">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="{{t.style}}">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="{{t.icon}}" fill="none" stroke="{{t.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tf: 1 }; }
  renderVals() {
    const tfs = [1, 2, 3, 5, 15].map((t) => {
      const on = this.state.tf === t;
      return { label: t + 'm', on: on ? 'true' : 'false', pick: () => this.setState({ tf: t }),
        style: 'min-height: 40px; border: 0; font: 600 13px IBM Plex Mono, monospace; ' + (on ? 'background: #E6EDF3; color: #0B1117' : 'background: #121A23; color: #9AABBB') };
    });
    let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const way = [[0, 102], [7, 106.5], [13, 103.4], [19, 106], [25, 101.6], [29, 104], [33, 100.8], [36, 98.6], [38, 102.8], [41, 104.2]];
    const base = []; let p = 102;
    for (let i = 0; i < 42; i++) {
      let k = 0; while (k < way.length - 2 && way[k + 1][0] < i) k++;
      const [x0, y0] = way[k], [x1, y1] = way[k + 1];
      const t = Math.min(1, Math.max(0, (i - x0) / ((x1 - x0) || 1)));
      const c = y0 + (y1 - y0) * t + (r() - 0.5) * 0.9;
      const o = p; base.push({ o, c, h: Math.max(o, c) + r() * 0.6, l: Math.min(o, c) - r() * 0.6 }); p = c;
    }
    base[36].l = 97.6;
    const tf = this.state.tf, C = [];
    for (let i = 14; i < base.length; i += tf) {
      const g = base.slice(i, i + tf);
      C.push({ o: g[0].o, c: g[g.length - 1].c, h: Math.max(...g.map((x) => x.h)), l: Math.min(...g.map((x) => x.l)) });
    }
    const hi = 108, lo = 96.8, Y = (v) => ((hi - v) / (hi - lo) * 100).toFixed(2);
    const candles = C.map((b) => {
      const up = b.c >= b.o, col = up ? '#2FC3A0' : '#F2695B';
      return { wick: 'position: absolute; left: 50%; width: 1px; background: ' + col + '; top: ' + Y(b.h) + '%; bottom: ' + (100 - Y(b.l)) + '%',
        body: 'position: absolute; left: 12%; right: 12%; top: ' + Y(Math.max(b.o, b.c)) + '%; height: max(1px, ' + Math.abs(Y(b.o) - Y(b.c)).toFixed(2) + '%); background: ' + (up ? '#174A40' : col) + '; border: 1px solid ' + col };
    });
    const Yp = (v) => (12 + (hi - v) / (hi - lo) * 276).toFixed(0);
    const lbl = (c) => 'position: absolute; left: 4px; top: -16px; font: 600 10.5px IBM Plex Sans, sans-serif; color: ' + c + '; white-space: nowrap';
    const marks = [
      { label: 'Máx. pre-market', style: 'position: absolute; left: 0; right: 0; top: ' + Yp(106.7) + 'px; border-top: 1px dashed #F0B43A', labelStyle: lbl('#F0B43A') },
      { label: 'Mín. pre-market', style: 'position: absolute; left: 0; right: 0; top: ' + Yp(98.3) + 'px; border-top: 1px dashed #F0B43A', labelStyle: 'position: absolute; left: 4px; top: 3px; font: 600 10.5px IBM Plex Sans, sans-serif; color: #F0B43A' },
      { label: 'FVG', style: 'position: absolute; left: 62%; right: 58px; top: ' + Yp(101.9) + 'px; height: ' + (Yp(100.6) - Yp(101.9)) + 'px; background: rgba(242,105,91,0.18); border: 1px solid rgba(242,105,91,0.6)', labelStyle: lbl('#F2695B') },
      { label: '9:30', style: 'position: absolute; top: 12px; bottom: 12px; left: 44%; border-left: 1px dashed #5D6E80', labelStyle: 'position: absolute; left: 4px; bottom: 2px; font: 500 10.5px IBM Plex Mono, monospace; color: #9AABBB' },
    ];
    const chip = 'padding: 6px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; ';
    const checks = [['✓ Horario', 'done'], ['✓ Liquidez', 'done'], ['… IFVG', 'wait'], ['✓ Objetivo', 'done'], ['Riesgo', 'todo'], ['0/1 trades', 'todo']]
      .map(([label, st]) => ({ label, style: chip + (st === 'done' ? 'background: #123128; color: #2FC3A0' : st === 'wait' ? 'background: #2A2312; color: #F0B43A; border: 1px solid #5A4A22' : 'background: #18222D; color: #9AABBB') }));
    const icons = {
      Inicio: 'M3 10l8-6 8 6v8H3z', Ruta: 'M4 18c4-8 10 0 14-12M4 18h0M18 6h0', Práctica: 'M4 4h14v14H4zM8 11l2 2 4-4',
      Simulador: 'M5 6v10M5 8h2v5H5M11 3v14M11 6h2v7h-2M17 7v9M17 9h2v4h-2', Diario: 'M5 3h10l3 3v13H5zM8 9h7M8 13h7',
    };
    const tabs = Object.keys(icons).map((label) => {
      const on = label === 'Simulador';
      return { label, icon: icons[label], href: label === 'Inicio' ? 'Main.dc.html' : label === 'Simulador' ? 'Movil.dc.html' : '#', color: on ? '#F0B43A' : '#8C9DAE',
        style: 'min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600; color: ' + (on ? '#F0B43A' : '#8C9DAE') };
    });
    return { tfs, candles, marks, checks, tabs };
  }
}
</script>
</body>
</html>
